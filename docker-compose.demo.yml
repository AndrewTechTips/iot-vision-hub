# The demo cameras (devices.demo.toml): real footage, no hardware.
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml up --wait
# The first start fetches the clips from Pexels (~12 MB) into the data volume and makes the
# loops (about 20 s); later starts reuse them. Sources and credits: docs/demo-footage.md.
services:
  api:
    command: ["sh", "-c", "vision-hub demo-footage && exec vision-hub serve"]
    environment:
      VISION_HUB_VISION__DEVICES_FILE: /app/devices.demo.toml # in the image
    healthcheck:
      start_period: 90s # the first start makes the loops before serving
